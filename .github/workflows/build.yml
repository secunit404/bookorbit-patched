name: Build patched release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this release was already built from the same patch set
        type: boolean
        default: false
      release_tag:
        description: Build this upstream tag instead of the latest release
        type: string
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: build-patched-release
  cancel-in-progress: false

env:
  UPSTREAM: bookorbit/bookorbit
  IMAGE: ghcr.io/${{ github.repository_owner }}/bookorbit-patched
  MANIFEST: patches/manifest.json
  STATE_FILE: state/last-built.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Resolve the upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG}" ]; then
            TAG="${REQUESTED_TAG}"
          else
            TAG=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Upstream release: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # Adding, editing or removing a patch must force a rebuild even when the image for this
      # release already exists, or the tag would keep pointing at an image missing the new patch.
      - name: Fingerprint the patch set
        id: fingerprint
        run: |
          set -euo pipefail
          SHA=$(jq -r '.patches[].file' "${MANIFEST}" | sort | xargs sha256sum "${MANIFEST}" | sha256sum | cut -c1-16)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Patch set: ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip releases already built from this patch set
        id: existing
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PATCH_SHA: ${{ steps.fingerprint.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          BUILT=false
          if [ "${FORCE}" != "true" ] && docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            RECORDED_SHA=$(jq -r --arg tag "${TAG}" 'select(.tag == $tag) | .patches_sha // ""' "${STATE_FILE}" 2>/dev/null || true)
            if [ "${RECORDED_SHA}" = "${PATCH_SHA}" ]; then
              BUILT=true
              echo "${IMAGE}:${TAG} already exists and matches patch set ${PATCH_SHA}, nothing to do." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${IMAGE}:${TAG} exists but was built from a different patch set, rebuilding." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "built=${BUILT}" >> "$GITHUB_OUTPUT"

      - name: Checkout the upstream release
        if: steps.existing.outputs.built != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.release.outputs.tag }}
          path: upstream

      # Each patch carries a marker whose presence in its target file means the change is already
      # there. Present before applying, upstream ships the fix and the patch is dropped; absent
      # after applying, the patch did not do what it claims and the build fails. A patch that no
      # longer applies is a hard failure on purpose: silently shipping an unpatched image under a
      # tag that claims to be patched is the one outcome this repository exists to prevent.
      - name: Apply the patches
        if: steps.existing.outputs.built != 'true'
        id: apply
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          APPLIED=()
          OBSOLETE=()

          while IFS=$'\t' read -r id file target marker description; do
            if grep -q "${marker}" "upstream/${target}"; then
              OBSOLETE+=("${id}")
              echo "::notice::${id} is already in ${TAG}, skipping (${description})"
              continue
            fi

            git -C upstream apply --verbose "${GITHUB_WORKSPACE}/${file}"

            if ! grep -q "${marker}" "upstream/${target}"; then
              echo "::error::${id} applied but ${marker} is missing from ${target}"
              exit 1
            fi
            APPLIED+=("${id}")
          done < <(jq -r '.patches[] | [.id, .file, .target, .marker, .description] | @tsv' "${MANIFEST}")

          {
            echo '## Patches'
            echo
            for id in "${APPLIED[@]:-}"; do [ -n "${id}" ] && echo "- applied \`${id}\`"; done
            for id in "${OBSOLETE[@]:-}"; do [ -n "${id}" ] && echo "- skipped \`${id}\` (upstream ships it)"; done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#APPLIED[@]} -eq 0 ]; then
            {
              echo
              echo '## Upstream ships every patch'
              echo
              echo 'Point the deployment back at ghcr.io/bookorbit/bookorbit and archive this repository.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'any=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A fixed suffix rather than the patch ids: it keeps APP_VERSION valid against the
          # release-notes SEMVER_RE (whose build-metadata group is [\w.]+ and so rejects the
          # hyphens in our ids), and a version that fails it silently disables the "never
          # announce releases newer than the running build" cap. Which patches are in is
          # answered by What's New and by state/last-built.json.
          echo 'any=true' >> "$GITHUB_OUTPUT"
          echo "applied=$(IFS=.; echo "${APPLIED[*]}")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.existing.outputs.built != 'true' && steps.apply.outputs.any == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.built != 'true' && steps.apply.outputs.any == 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: APP_VERSION=${{ steps.release.outputs.tag }}+patches
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Also keeps the scheduled trigger alive: GitHub disables cron in repositories
      # that see no activity for 60 days.
      - name: Record the built release
        if: steps.existing.outputs.built != 'true' && steps.apply.outputs.any == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PATCH_SHA: ${{ steps.fingerprint.outputs.sha }}
          APPLIED: ${{ steps.apply.outputs.applied }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${STATE_FILE}")"
          jq -n \
            --arg image "${IMAGE}:${TAG}" \
            --arg tag "${TAG}" \
            --arg upstream "${UPSTREAM}@${TAG}" \
            --arg patches_sha "${PATCH_SHA}" \
            --arg applied "${APPLIED}" \
            --arg built_at "$(date -u +%FT%TZ)" \
            '{image: $image, tag: $tag, upstream: $upstream, patches_sha: $patches_sha, applied: ($applied | split(".")), built_at: $built_at}' \
            > "${STATE_FILE}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${STATE_FILE}"
          git commit -m "chore: record ${TAG} image build" || exit 0
          git push
          echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:release" >> "$GITHUB_STEP_SUMMARY"
